services:
  vllm:
    image: vllm/vllm-openai-cpu:v0.28.0-x86_64
    platform: linux/amd64
    command:
      - Qwen/Qwen3-0.6B
      - --served-model-name
      - local-model
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --max-model-len
      - "2048"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "1024"
      - --language-model-only
      - --enforce-eager
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --generation-config
      - vllm
    user: "0:0"
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_CPU_OMP_THREADS_BIND: auto
      VLLM_CPU_NUM_OF_RESERVED_CPU: "1"
      VLLM_NO_USAGE_STATS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "0"
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - vllm_cache:/root/.cache/vllm
    cpus: 6
    mem_limit: 8g
    shm_size: 4g
    cap_add:
      - SYS_NICE
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10m
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  huggingface_cache:
  vllm_cache:
