include:
  - compose.databases.yml

services:
  vllm-generation:
    image: vllm/vllm-openai-cpu:v0.28.0-x86_64
    platform: linux/amd64
    command:
      - ${GENERATION_MODEL_ID:?set GENERATION_MODEL_ID in .env}
      - --served-model-name
      - local-model
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "1"
      - --language-model-only
      - --enforce-eager
      - --generation-config
      - vllm
    user: "0:0"
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_CPU_OMP_THREADS_BIND: auto
      VLLM_CPU_NUM_OF_RESERVED_CPU: "1"
      VLLM_NO_USAGE_STATS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - vllm_generation_cache:/root/.cache/vllm
    cpus: 8
    mem_limit: 12g
    shm_size: 4g
    cap_add:
      - SYS_NICE
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10m
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    platform: linux/amd64
    command:
      - --model-id
      - ${EMBEDDING_MODEL_ID:?set EMBEDDING_MODEL_ID in .env}
      - --dtype
      - float32
      - --huggingface-hub-cache
      - /data/hub
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
    ports:
      - "127.0.0.1:9000:80"
    volumes:
      - huggingface_cache:/data
    cpus: 2
    mem_limit: 2.25g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10m
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  huggingface_cache:
  vllm_generation_cache:
