services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=5m
    #	- OLLAMA_NUM_PARALLEL=1
    #	- OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama-setup:
    image: ollama/ollama:latest
    container_name: ollama_puller
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        for m in phi gemma; do
          if ! ollama list | grep -q "$m"; then
            echo "Scaricamento modello $m..."
            ollama pull $m
          else
            echo "Modello $m già presente."
          fi
        done
        echo "Inizializzazione completata con successo."
    restart: "no"


  app:
    build: .
    container_name: multi_agent_app
    volumes:
      - .:/app
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama-setup:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  ollama_storage: