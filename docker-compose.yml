include:
  - compose.local.yml
  - compose.wp3.yml

services:
  tei-embedding:
    profiles: [vector]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    platform: linux/amd64
    command:
      - --model-id
      - ${EMBEDDING_MODEL_ID:-google/embeddinggemma-300m}
      - --dtype
      - float32
      - --huggingface-hub-cache
      - /data/hub
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
    ports:
      - "127.0.0.1:9000:80"
    volumes:
      - huggingface_cache:/data
    cpus: 2
    mem_limit: 2.25g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10m
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    profiles: [vector]
    image: qdrant/qdrant:v1.19.0
    cpus: 1
    mem_limit: 1g
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  huggingface_cache:
  qdrant_data:
