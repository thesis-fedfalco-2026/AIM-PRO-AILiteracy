services:
  wp3-postgres:
    image: py-prototype/wp3-postgres:18.6
    build:
      context: ./infra/wp3
    restart: unless-stopped
    environment:
      POSTGRES_DB: wp3
      POSTGRES_USER: wp3_admin
      POSTGRES_PASSWORD: ${WP3_ADMIN_PASSWORD:?set WP3_ADMIN_PASSWORD in .env}
      WP3_READER_PASSWORD: ${WP3_READER_PASSWORD:?set WP3_READER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WP3_PORT:-55432}:5432"
    volumes:
      - wp3_data:/var/lib/postgresql
      - ${WP3_DUMP_PATH:-./.cache/wp3/catalog.dump}:/backup/catalog.dump:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wp3_admin -d wp3 && psql -U wp3_admin -d wp3 -tAc 'SELECT count(*) FROM wp3_search.documents' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  wp3_data:
