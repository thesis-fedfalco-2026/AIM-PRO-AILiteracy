[llm]
backend = vllm
temperature = 0.2
top_p = 0.9
max_tokens = 512
timeout = 120

[backend:vllm]
model = local-model
base_url = http://127.0.0.1:8000/v1

[backend:openai]
model = gpt-4.1-mini
base_url = https://api.openai.com/v1

[backend:anthropic]
model = claude-sonnet-4-6
base_url = https://api.anthropic.com
