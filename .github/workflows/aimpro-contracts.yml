name: AIM-PRO contracts

on:
  push:
  pull_request:

jobs:
  generated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pydantic==2.12.5 PyYAML==6.0.3
      - run: python -m aimpro.generate --check
      - run: python -m aimpro.generate docs/resources/aimpro-megamodel-2026-11-04.json --output docs/aimpro/generated-2026-11-04 --check
      - run: python -m unittest tests.test_aimpro_audit tests.test_aimpro_change_requests tests.test_aimpro_adapter tests.test_aimpro_contracts tests.test_aimpro_data_types tests.test_aimpro_lead tests.test_aimpro_didactic tests.test_aimpro_retrieval tests.test_aimpro_authoring tests.test_aimpro_syllabus tests.test_aimpro_bindings tests.test_aimpro_execution_setup tests.test_aimpro_demo tests.test_aimpro_trace -v

  authoring-architecture:
    runs-on: ubuntu-latest
    env:
      LANGFUSE_ENABLED: 'false'
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_syllabus_coverage tests.test_source_selection tests.test_authoring_generators tests.test_structured_teacher tests.test_authoring_projects tests.test_authoring_cycle tests.test_releases tests.test_store_architecture tests.test_anthropic tests.test_scn01_evaluator_evidence tests.test_seed tests.test_learning_review -v

  store-backends:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: alm_test
          POSTGRES_USER: alm
          POSTGRES_PASSWORD: alm-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alm -d alm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LANGFUSE_ENABLED: 'false'
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_TRACING_ENABLED: 'false'
      ALM_TEST_POSTGRES_URL: postgresql://alm:alm-ci-only@127.0.0.1:5432/alm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_store_backends tests.test_learning_store tests.test_learning_service tests.test_learning_decisions tests.test_authoring_projects tests.test_releases tests.test_authoring_cycle tests.test_seed tests.test_learning_review tests.services.test_authoring_read_api tests.services.test_authoring_review_api -v

  api-skeleton:
    runs-on: ubuntu-latest
    env:
      LANGFUSE_ENABLED: 'false'
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m services.api_common.openapi --check
      - run: python -m unittest tests.services.test_api_common tests.services.test_api_identity tests.services.test_api_openapi tests.services.test_dev_identity tests.services.test_api_contexts tests.services.test_authoring_read_api tests.services.test_authoring_review_api -v

  front-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check:client
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    env:
      LANGFUSE_ENABLED: 'false'
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_TRACING_ENABLED: 'false'
      ALM_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps
      - run: npx playwright install --with-deps chromium
        working-directory: apps
      - name: Throwaway secrets for the local Keycloak realm
        run: |
          for name in ALM_KEYCLOAK_ADMIN_PASSWORD ALM_KEYCLOAK_DEV_PASSWORD ALM_OIDC_CLIENT_SECRET; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: docker compose -f compose.identity.yml up -d --wait
      - run: npm run test:browser
        working-directory: apps
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            apps/e2e/.state/report
            apps/e2e/.state/results
      - if: always()
        run: docker compose -f compose.identity.yml down

  offline-evaluation:
    runs-on: ubuntu-latest
    env:
      LANGFUSE_ENABLED: 'false'
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_evaluation tests.test_events -v
      - run: python -m evaluation --check
      - run: python -m evaluation --planning-mode controlled-two-step --check
