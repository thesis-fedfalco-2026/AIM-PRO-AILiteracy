name: AIM-PRO contracts

on:
  push:
  pull_request:

jobs:
  generated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pydantic==2.12.5 PyYAML==6.0.3
      - run: python -m aimpro.generate --check
      - run: python -m unittest tests.test_aimpro_audit tests.test_aimpro_change_requests tests.test_aimpro_adapter tests.test_aimpro_contracts tests.test_aimpro_lead tests.test_aimpro_didactic tests.test_aimpro_retrieval tests.test_aimpro_authoring tests.test_aimpro_syllabus tests.test_aimpro_bindings tests.test_aimpro_execution_setup tests.test_aimpro_demo tests.test_aimpro_trace -v

  authoring-architecture:
    runs-on: ubuntu-latest
    env:
      LANGFUSE_ENABLED: 'false'
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_syllabus_coverage tests.test_source_selection tests.test_authoring_generators tests.test_authoring_projects tests.test_authoring_cycle tests.test_anthropic tests.test_scn01_evaluator_evidence -v

  offline-evaluation:
    runs-on: ubuntu-latest
    env:
      LANGFUSE_ENABLED: 'false'
      CREWAI_DISABLE_TELEMETRY: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_evaluation tests.test_events -v
      - run: python -m evaluation --check
      - run: python -m evaluation --planning-mode controlled-two-step --check
